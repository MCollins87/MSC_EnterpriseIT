<html>
<head>
    <title>{{ page.title }} | Mark Collins</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>

<body class="is-preload">

    <div id="page-wrapper">

        <!-- Header -->
        <header id="header">

            <h1>
                <a href="{{ '/' | relative_url }}">
                    Mark Collins | MSc Enterprise IT
                </a>
            </h1>

            <nav id="nav">
                <ul>

                    <li>
                        <a href="{{ '/' | relative_url }}">
                            MSc Home
                        </a>
                    </li>

                    <li>
                        <a href="#" class="icon solid fa-angle-down">
                            Menu
                        </a>

                        <ul>
                            <li>
                                <a href="{{ '/' | relative_url }}#modules">
                                    Modules
                                </a>
                            </li>

                            <li>
                                <a href="https://github.com/MCollins87/MScProject">
                                    MSc Project
                                </a>
                            </li>

                            <li>
                                <a href="https://mcollins87.github.io/">
                                    Main Portfolio
                                </a>
                            </li>
                        </ul>
                    </li>

                </ul>
            </nav>

        </header>

        <!-- Main -->
        <section id="main" class="container">

            <header>
                <h2>{{ page.title }}</h2>

                {% if page.subtitle %}
                <p>{{ page.subtitle }}</p>
                {% endif %}
            </header>

            <div class="box">
                {{ content }}
            </div>

        </section>

        <!-- Footer -->
        <footer id="footer">

            <ul class="icons">
                <li>
                    <a
                        href="https://www.linkedin.com/in/mark-collins-9471a955"
                        class="icon brands fa-linkedin"
                        aria-label="LinkedIn"
                    >
                        <span class="label">LinkedIn</span>
                    </a>
                </li>
            </ul>

            <ul class="copyright">
                <li>&copy; Mark Collins. All rights reserved.</li>
                <li>
                    Design:
                    <a href="https://html5up.net">HTML5 UP</a>
                </li>
            </ul>

        </footer>

    </div>

    <!-- Scripts -->
    <script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/jquery.dropotron.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/jquery.scrollex.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/util.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>
</html>
